; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = controllino_micro_rs485
include_dir = 
src_dir = src

[env:controllino_micro_rs485]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#4.1.1
board = generic
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
board_build.filesystem_size = 6m
monitor_speed = 115200
lib_deps = 
	SPI
	Wire
	controllino_micro
	LittleFS
	MD5Builder
	PicoOTA
	Updater
	mongoose
	mongoose_arduino_pico
	webapp
	arduino-libraries/ArduinoRS485@^1.1.0
lib_ignore =
	CAN
build_flags = 
	-D CONTROLLINO_MICRO
	-D CONTROLLINO_MICRO_RS485
	-D PIN_SERIAL2_TX=8
	-D PIN_SERIAL2_RX=9
	-D RS485_SERIAL_PORT=Serial2
	-D RS485_DEFAULT_TX_PIN=8
	-D CUSTOM_RS485_DEFAULT_RE_PIN=10
	-D CUSTOM_RS485_DEFAULT_DE_PIN=11
	-D PIN_SPI_SS_ETHERNET_LIB=17
	; -D LED_BLINK
extra_scripts =
	pre:build_web.py

[env:controllino_micro_can]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#4.1.1
board = generic
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
board_build.filesystem_size = 6m
monitor_speed = 115200
lib_deps = 
	SPI
	Wire
	CAN
	controllino_micro
	LittleFS
	MD5Builder
	PicoOTA
	Updater
	mongoose
	mongoose_arduino_pico
	webapp
lib_ignore =
	arduino-libraries/ArduinoRS485@^1.1.0
build_flags = 
	-D CONTROLLINO_MICRO
	-D CONTROLLINO_MICRO_CAN
	-D MCP2515_DEFAULT_SPI=SPI1
	-D MCP2515_DEFAULT_CS_PIN=9
	-D MCP2515_DEFAULT_INT_PIN=12
	-D MCP2515_DEFAULT_CLOCK_FREQUENCY=20E6
	-D PIN_SPI_SS_ETHERNET_LIB=17
	; -D LED_BLINK
extra_scripts =
	pre:build_web.py